<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LifeGuard — Safe Routes</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" type="image/png" href="/assets/img/logo.png?v=2" />
  <link rel="apple-touch-icon" href="/assets/img/logo.png?v=2" />
</head>
<body>
  <div class="bg-animation" id="bgAnim">
    <div class="lightning-flash"></div>
    <div class="rain" id="rain"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <header class="site-header">
    <div class="header-brand">
      <img src="assets/img/logo.png" alt="LifeGuard Logo" class="site-logo">
      <span class="logo-text">LifeGuard Maps</span>
    </div>
    <nav class="nav">
      <a href="/index.html" data-i18n="nav_dashboard">Dashboard</a>
      <a href="/map.html" class="active" data-i18n="nav_safe_routes">Safe Routes</a>
      <a href="/rescue.html" data-i18n="nav_rescue">Rescue</a>

      <div class="lang-toggle mobile-only">
          <button class="lang-btn active" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('hi')">HI</button>
          <button class="lang-btn" onclick="setLang('mr')">MR</button>
      </div>
    </nav>
    <div class="lang-toggle desktop-only">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('hi')">HI</button>
        <button class="lang-btn" onclick="setLang('mr')">MR</button>
    </div>
    <button class="menu-toggle" id="menuToggle">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main class="container">
    <section class="hero">
        <h1 data-i18n="hero_map_title">Escape Navigation</h1>
        <p class="tagline" data-i18n="hero_map_tagline">OPTIMIZED EVACUATION PATHS BASED ON AI RISK LEVELS</p>
    </section>

    <div class="card">
        <div class="map-controls">
            <button id="locate" data-i18n="btn_locate">FIND SAFE ROUTES NEAR ME</button>
        </div>
        <div id="map"></div>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    let map;
    let userMarker = null;
    let watchId = null;
    let directionsService;
    const renderers = []; // Store multiple renderers if needed
    const destMarkers = [];
 
    function loadGoogleMaps(cb){
      if(typeof FG_CONFIG === 'undefined' || !FG_CONFIG.GOOGLE_MAPS_API_KEY || FG_CONFIG.GOOGLE_MAPS_API_KEY === 'YOUR_GOOGLE_MAPS_API_KEY'){
        alert('Please set FG_CONFIG.GOOGLE_MAPS_API_KEY in assets/js/config.js');
        return;
      }
      const key = FG_CONFIG.GOOGLE_MAPS_API_KEY;
      const script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + key + '&libraries=places';
      script.async = true; script.defer = true; script.onload = cb;
      document.head.appendChild(script);
    }
 
    function init(){
      loadGoogleMaps(()=>{
        directionsService = new google.maps.DirectionsService();
        map = new google.maps.Map(document.getElementById('map'), { 
            center: {lat:20.0, lng:78.0}, 
            zoom:5,
            disableDefaultUI: true,
            zoomControl: true,
            gestureHandling: 'greedy',
            styles: [
                { "elementType": "geometry", "stylers": [{ "color": "#242f3e" }] },
                { "elementType": "labels.text.fill", "stylers": [{ "color": "#746855" }] },
                { "elementType": "labels.text.stroke", "stylers": [{ "color": "#242f3e" }] },
                { "featureType": "administrative.locality", "elementType": "labels.text.fill", "stylers": [{ "color": "#d59563" }] },
                { "featureType": "poi", "elementType": "labels.text.fill", "stylers": [{ "color": "#d59563" }] },
                { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#38414e" }] },
                { "featureType": "road", "elementType": "geometry.stroke", "stylers": [{ "color": "#212a37" }] },
                { "featureType": "road", "elementType": "labels.text.fill", "stylers": [{ "color": "#9ca5b3" }] },
                { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#17263c" }] }
            ]
        });
 
        // Auto-start location tracking
        startTracking();
 
        // Button also triggers safe route calculation
        document.getElementById('locate').addEventListener('click', ()=>{
          if(!navigator.geolocation){ alert('Geolocation not supported'); return; }
          navigator.geolocation.getCurrentPosition(pos=>{
            const lat = pos.coords.latitude, lng = pos.coords.longitude;
            showSafeRoutes(lat, lng);
          }, err=>{ alert('Unable to get location: ' + err.message); });
        });
      });
 
      // Generate rain drops
      const rainContainer = document.getElementById('rain');
      for (let i = 0; i < 50; i++) {
          const drop = document.createElement('div');
          drop.className = 'drop';
          drop.style.left = Math.random() * 100 + 'vw';
          drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
          drop.style.animationDelay = Math.random() * 2 + 's';
          rainContainer.appendChild(drop);
      }
    }
 
    let accuracyCircle = null;
 
    function startTracking() {
        if(!navigator.geolocation) return;
        
        watchId = navigator.geolocation.watchPosition(pos => {
            const lat = pos.coords.latitude, lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;
            updateUserPosition(lat, lng, accuracy);
        }, err => {
            console.log('Location tracking error:', err.message);
        }, {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
        });
    }
 
    function updateUserPosition(lat, lng, accuracy) {
        const pos = {lat, lng};
        
        if(userMarker) {
            userMarker.setPosition(pos);
        } else {
            userMarker = new google.maps.Marker({
                position: pos,
                map: map,
                title: 'You are here',
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 10,
                    fillColor: '#00d2ff',
                    fillOpacity: 1,
                    strokeColor: '#ffffff',
                    strokeWeight: 3
                },
                zIndex: 999
            });
            map.setCenter(pos);
            map.setZoom(14);
        }
 
        if(accuracy) {
            if(accuracyCircle) {
                accuracyCircle.setCenter(pos);
                accuracyCircle.setRadius(accuracy);
            } else {
                accuracyCircle = new google.maps.Circle({
                    map: map,
                    center: pos,
                    radius: accuracy,
                    fillColor: '#00d2ff',
                    fillOpacity: 0.1,
                    strokeColor: '#00d2ff',
                    strokeOpacity: 0.3,
                    strokeWeight: 1
                });
            }
        }
    }
 
    function showSafeRoutes(lat, lng) {
        // Clear previous routes and destination markers
        renderers.forEach(r => r.setMap(null)); renderers.length = 0;
        destMarkers.forEach(m => m.setMap(null)); destMarkers.length = 0;
        
        updateUserPosition(lat, lng);
 
        const dests = FG_CONFIG.SAFE_DESTINATIONS || [{name:'Safe Point A', lat:lat+0.02, lng:lng+0.02}];
        const origin = new google.maps.LatLng(lat, lng);
 
        dests.forEach((d, i) => {
            const destination = new google.maps.LatLng(d.lat, d.lng);
            
            const request = {
                origin: origin,
                destination: destination,
                travelMode: 'DRIVING'
            };
 
            directionsService.route(request, (result, status) => {
                if (status == 'OK') {
                    const renderer = new google.maps.DirectionsRenderer({
                        map: map,
                        directions: result,
                        suppressMarkers: false,
                        polylineOptions: {
                            strokeColor: i === 0 ? '#4ade80' : '#94a3b8',
                            strokeWeight: 6,
                            strokeOpacity: 0.8
                        }
                    });
                    renderers.push(renderer);
                } else {
                    console.error('Directions request failed due to ' + status);
                    // Fallback to straight line if directions fail
                    const line = new google.maps.Polyline({
                        path: [origin, destination],
                        strokeColor: '#ff4b2b',
                        strokeWeight: 3,
                        map: map,
                        opacity: 0.5,
                        dashStyle: 'dash'
                    });
                }
            });
        });
    }
 
    window.addEventListener('DOMContentLoaded', init);
  </script>

</body>
</html>
